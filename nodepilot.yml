# NodePilot Pipeline Configuration
version: 1

branches:
  - main

project:
  name: hold-yourself
  runtime: node
  node_version: 20

server:
  # The path on the VPS where the project should be deployed
  # IMPORTANT: Update this to your actual VPS path if different
  deploy_path: /root/hold-yourself

steps:
  install:
    - pnpm install
  build:
    - pnpm build
  deploy:
    - pm2 startOrReload ecosystem.config.js
    - pm2 save
