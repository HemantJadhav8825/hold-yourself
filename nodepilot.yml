# NodePilot Pipeline Configuration
version: 1

branches:
  - main

project:
  name: hold-yourself
  runtime: node
  node_version: 20

server:
  deploy_path: /root/hold-yourself

steps:
  # ----------------------------
  # INSTALL
  # ----------------------------
  install:
    - corepack enable
    - pnpm store prune
    - pnpm install --force

  # ----------------------------
  # BUILD
  # ----------------------------
  build:
    # Kill all caches (non-negotiable)
    - rm -rf .turbo
    - rm -rf apps/frontend/.next
    - rm -rf apps/backend/dist
    - rm -rf services/**/dist

    # Force fresh Turbo builds (package-name based)
    - TURBO_FORCE=true pnpm build --filter @hold-yourself/frontend...
    - TURBO_FORCE=true pnpm build --filter @hold-yourself/backend...
    - TURBO_FORCE=true pnpm build --filter @hold-yourself/auth-service...
    - TURBO_FORCE=true pnpm build --filter @hold-yourself/chat-service...
    - TURBO_FORCE=true pnpm build --filter @hold-yourself/holding-space-service...

    # Build guards (fail fast if something didn't compile)
    - test -d apps/frontend/.next
    - test -f apps/backend/dist/server.js
    - test -f services/auth-service/dist/server.js
    - test -f services/chat-service/dist/server.js
    - test -f services/holding-space-service/dist/index.js

  # ----------------------------
  # DEPLOY
  # ----------------------------
  deploy:
    # Backend
    - pm2 delete hold-yourself-backend || true
    - pm2 start ecosystem.config.js --only hold-yourself-backend

    # Services
    - pm2 delete hold-yourself-auth || true
    - pm2 delete hold-yourself-chat || true
    - pm2 delete hold-yourself-holding-space || true
    - pm2 start ecosystem.config.js --only hold-yourself-auth,hold-yourself-chat,hold-yourself-holding-space

    # Frontend (Next.js)
    - pm2 delete hold-yourself-frontend || true
    - pm2 start ecosystem.config.js --only hold-yourself-frontend

    # Persist process list
    - pm2 save
