# NodePilot Pipeline Configuration
version: 1

branches:
  - main

project:
  name: hold-yourself
  runtime: node
  node_version: 20

server:
  deploy_path: /root/hold-yourself

steps:
  install:
    - corepack enable
    - pnpm store prune
    - pnpm install --force

  build:
    # Kill monorepo caches
    - rm -rf .turbo

    # Kill runtime build outputs
    - rm -rf apps/frontend/.next
    - rm -rf apps/backend/dist
    - rm -rf services/**/dist

    # Force fresh builds for ALL runtime targets
    - TURBO_FORCE=true pnpm build --filter frontend...
    - TURBO_FORCE=true pnpm build --filter backend...
    - TURBO_FORCE=true pnpm build --filter ./services/...

  deploy:
    # Frontend
    - pm2 delete frontend || true
    - pm2 start ecosystem.config.js --only frontend

    # Backend
    - pm2 delete backend || true
    - pm2 start ecosystem.config.js --only backend

    # Services
    - pm2 delete auth || true
    - pm2 delete payment || true
    - pm2 delete notification || true
    - pm2 start ecosystem.config.js --only auth,payment,notification

    - pm2 save
